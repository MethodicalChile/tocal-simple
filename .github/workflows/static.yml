name: Deploy Tocal to GitHub Pages

# Publica tres versiones en el mismo sitio:
#   main        -> https://methodicalchile.github.io/tocal-simple/
#   dev         -> https://methodicalchile.github.io/tocal-simple/propuesta-2/
#   propuesta-3 -> https://methodicalchile.github.io/tocal-simple/propuesta-3/
# Este archivo debe ser igual en las tres ramas: cualquiera que reciba un push
# reconstruye las tres versiones.

on:
  push:
    branches:
      - main
      - dev
      - propuesta-3

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Checkout propuesta-3
        uses: actions/checkout@v4
        with:
          ref: propuesta-3
          path: propuesta-3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            dev/package-lock.json
            propuesta-3/package-lock.json

      - name: Build main
        working-directory: main
        run: npm ci && npm run build
        env:
          VITE_BASE: /tocal-simple/

      - name: Build dev (propuesta 2)
        working-directory: dev
        run: npm ci && npm run build
        env:
          VITE_BASE: /tocal-simple/propuesta-2/

      - name: Build propuesta 3
        working-directory: propuesta-3
        run: npm ci && npm run build
        env:
          VITE_BASE: /tocal-simple/propuesta-3/

      - name: Combine sites
        run: |
          mkdir -p site/propuesta-2 site/propuesta-3
          cp -r main/dist/. site/
          cp -r dev/dist/. site/propuesta-2/
          cp -r propuesta-3/dist/. site/propuesta-3/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
