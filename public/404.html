<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Página no encontrada | TOCAL</title>
    <link rel="icon" href="/images/logo-marca.png" type="image/png" />
    <style>
      :root {
        --bg: #0b1018;
        --card: #10161f;
        --accent: #f26b21;
        --white: #ffffff;
        --muted: rgba(255, 255, 255, 0.72);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--white);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .card {
        max-width: 540px;
        width: 100%;
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-top: 4px solid var(--accent);
        border-radius: 10px;
        padding: 40px 32px;
        text-align: center;
      }
      .logo {
        height: 54px;
        width: auto;
        margin: 0 auto 20px;
        display: block;
      }
      .code {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 4px;
        background: rgba(242, 107, 33, 0.16);
        color: var(--accent);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 26px;
      }
      p {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }
      .en {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 13px 26px;
        border-radius: 4px;
        background: var(--accent);
        color: #111827;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
      }
      .btn:hover {
        background: #df5c14;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/images/logo-tocal-blanco.png" alt="TOCAL" class="logo" />
      <span class="code">Error 404</span>
      <h1>Página no encontrada / Page not found</h1>
      <p>
        La dirección que intentas visitar no existe o fue trasladada dentro del sitio corporativo de TOCAL.
      </p>
      <p class="en">
        The page you are looking for does not exist or has been moved within TOCAL’s corporate website.
      </p>
      <a href="/" class="btn">Ir al inicio / Go to Home →</a>
    </main>
  </body>
</html>
